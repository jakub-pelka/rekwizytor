<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Alert — podgląd</title>
<style>html,body{margin:0} body{background:var(--bg);padding:20px}</style></head>
<body>
<div class="rk">
<div class="rk-stack" style="max-width:520px">
<div class="rk-alert rk-alert--warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div><strong>3 rekwizyty nie są odhaczone</strong>Lista zadań „Wesele” — akt II. Spektakl za 45 minut.</div></div>
<div class="rk-alert rk-alert--ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.94 14.06 8 20l-1.94-5.94L0 12l6.06-1.94L8 4l1.94 6.06L16 12z" transform="translate(2 -1) scale(.9)"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg><div><strong>Rozpoznano 6 przedmiotów na zdjęciu</strong>Sprawdź propozycje nazw przed zapisaniem.</div></div>
<div class="rk-alert rk-alert--success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><div>Etykiety wysłane do druku.</div></div>
<div class="rk-alert rk-alert--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><div>Nie udało się zapisać zdjęcia. Spróbuj ponownie.</div></div>
</div>
</div>
</body>
</html>
