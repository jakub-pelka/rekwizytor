<!-- @dsCard group="Status" height=328 subtitle="Powiadomienie" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Toast — podgląd</title>
<style>html,body{margin:0} body{background:var(--bg);padding:20px}</style></head>
<body>
<div class="rk">
<div class="rk-toasts" role="status">
<div class="rk-toast rk-toast--success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Zapisano zmiany w „Kielich srebrny”.</span><button class="rk-toast__action">Cofnij</button></div>
<div class="rk-toast rk-toast--ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.94 14.06 8 20l-1.94-5.94L0 12l6.06-1.94L8 4l1.94 6.06L16 12z" transform="translate(2 -1) scale(.9)"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg><span>Rozpoznano 6 przedmiotów na zdjęciu.</span><button class="rk-toast__action">Sprawdź</button></div>
<div class="rk-toast rk-toast--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><span>Nie udało się wysłać zdjęcia. Sprawdź połączenie.</span><button class="rk-toast__action">Ponów</button></div>
<div class="rk-toast rk-toast--info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>Włączono oszczędny tryb animacji. Zmienisz to w Ustawieniach.</span><button class="rk-toast__action">Ustawienia</button></div></div>
</div>
</body>
</html>
