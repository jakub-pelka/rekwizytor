<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>DatePicker — podgląd</title>
<style>html,body{margin:0} body{background:var(--bg);padding:20px}</style></head>
<body>
<div class="rk">
<div class="rk-row" style="align-items:flex-start;gap:24px">
<label class="rk-field" style="width:300px"><span class="rk-label">Termin spektaklu</span><button class="rk-date-field" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Pt, 9 października 2026 · 19:00</button><span class="rk-hint">Scena duża</span></label>

<div class="rk-cal__grid"><span class="rk-cal__dow">Pn</span><span class="rk-cal__dow">Wt</span><span class="rk-cal__dow">Śr</span><span class="rk-cal__dow">Cz</span><span class="rk-cal__dow">Pt</span><span class="rk-cal__dow">So</span><span class="rk-cal__dow">Nd</span><button class="rk-cal__day is-out" aria-selected="false">28</button><button class="rk-cal__day is-out" aria-selected="false">29</button><button class="rk-cal__day is-out" aria-selected="false">30</button><button class="rk-cal__day " aria-selected="false">1</button><button class="rk-cal__day has-show" aria-selected="false">2</button><button class="rk-cal__day has-show" aria-selected="false">3</button><button class="rk-cal__day is-today" aria-selected="false">4</button><button class="rk-cal__day " aria-selected="false">5</button><button class="rk-cal__day " aria-selected="false">6</button><button class="rk-cal__day " aria-selected="false">7</button><button class="rk-cal__day " aria-selected="false">8</button><button class="rk-cal__day has-show" aria-selected="true">9</button><button class="rk-cal__day has-show" aria-selected="false">10</button><button class="rk-cal__day " aria-selected="false">11</button><button class="rk-cal__day " aria-selected="false">12</button><button class="rk-cal__day " aria-selected="false">13</button><button class="rk-cal__day " aria-selected="false">14</button><button class="rk-cal__day " aria-selected="false">15</button><button class="rk-cal__day has-show" aria-selected="false">16</button><button class="rk-cal__day has-show" aria-selected="false">17</button><button class="rk-cal__day " aria-selected="false">18</button><button class="rk-cal__day " aria-selected="false">19</button><button class="rk-cal__day " aria-selected="false">20</button><button class="rk-cal__day " aria-selected="false">21</button><button class="rk-cal__day " aria-selected="false">22</button><button class="rk-cal__day has-show" aria-selected="false">23</button><button class="rk-cal__day has-show" aria-selected="false">24</button><button class="rk-cal__day " aria-selected="false">25</button><button class="rk-cal__day " aria-selected="false">26</button><button class="rk-cal__day " aria-selected="false">27</button><button class="rk-cal__day " aria-selected="false">28</button><button class="rk-cal__day " aria-selected="false">29</button><button class="rk-cal__day has-show" aria-selected="false">30</button><button class="rk-cal__day " aria-selected="false">31</button><button class="rk-cal__day is-out" aria-selected="false">1</button></div>
<span class="rk-cal__legend"><i></i>dni z zaplanowanym spektaklem</span>

</div>
</body>
</html>
