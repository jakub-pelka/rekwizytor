<!-- @dsCard group="Dane" height=420 subtitle="Kolory i formy wykresów" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Wykresy — podgląd</title>
<style>html,body{margin:0} body{background:var(--bg);padding:20px;font-family:var(--font-sans);color:var(--ink)}
[data-theme="dark"] .c i:last-child{background:var(--chart-seq-500)!important}[data-theme="dark"] .hb i{background:var(--chart-seq-500)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px}
.id{font:700 11px var(--font-typewriter);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:8px}
.sw{display:flex;gap:4px}.s{flex:1;height:28px;border-radius:4px}.qs{display:flex;gap:2px;margin-top:8px}.q{flex:1;height:18px;border-radius:3px}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;border-bottom:1px solid var(--chart-grid)}.c{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.c i{flex:1;border-radius:3px 3px 0 0;max-width:12px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink-muted);margin-bottom:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;font-size:12px;margin:5px 0;color:var(--ink-muted)}.hb i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--chart-seq-600)}.hb b{color:var(--ink);font-weight:500}
.meter{height:8px;border-radius:4px;background:var(--surface-raised);margin-top:6px}.meter i{display:block;height:100%;width:83%;border-radius:4px;background:var(--kurtyna)}.hero{font:600 40px/1 var(--font-sans)}</style></head>
<body>
<div class="g">
<div class="p"><span class="id">Serie (stała kolejność)</span><div class="sw"><span class="s" style="background:var(--chart-1)"></span><span class="s" style="background:var(--chart-2)"></span><span class="s" style="background:var(--chart-3)"></span><span class="s" style="background:var(--chart-4)"></span><span class="s" style="background:var(--chart-5)"></span><span class="s" style="background:var(--chart-6)"></span></div><span class="id" style="margin-top:14px">Skala kurtyny 100–700</span><div class="qs"><span class="q" style="background:var(--chart-seq-100)"></span><span class="q" style="background:var(--chart-seq-200)"></span><span class="q" style="background:var(--chart-seq-300)"></span><span class="q" style="background:var(--chart-seq-400)"></span><span class="q" style="background:var(--chart-seq-500)"></span><span class="q" style="background:var(--chart-seq-600)"></span><span class="q" style="background:var(--chart-seq-700)"></span></div></div>
<div class="p"><span class="id">Gotowość najbliższego spektaklu</span><div class="hero">83%</div><div class="meter"><i></i></div><div style="font-size:12px;color:var(--ink-muted);margin-top:6px">68 z 82 zadań</div></div>
<div class="p"><span class="id">Wyróżnienie: ten sezon na tle poprzedniego</span><div class="leg"><span><i style="background:var(--chart-seq-600)"></i>2026/27</span><span><i style="background:var(--chart-context)"></i>2025/26</span></div><div class="cols"><span class="c"><i style="height:23%;background:var(--chart-context)"></i><i style="height:32%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:22%;background:var(--chart-context)"></i><i style="height:42%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:27%;background:var(--chart-context)"></i><i style="height:47%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:31%;background:var(--chart-context)"></i><i style="height:37%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:29%;background:var(--chart-context)"></i><i style="height:54%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:35%;background:var(--chart-context)"></i><i style="height:64%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:32%;background:var(--chart-context)"></i><i style="height:59%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:38%;background:var(--chart-context)"></i><i style="height:73%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:36%;background:var(--chart-context)"></i><i style="height:68%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:40%;background:var(--chart-context)"></i><i style="height:78%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:38%;background:var(--chart-context)"></i><i style="height:74%;background:var(--chart-seq-600)"></i></span><span class="c"><i style="height:46%;background:var(--chart-context)"></i><i style="height:98%;background:var(--chart-seq-600)"></i></span></div></div>
<div class="p"><span class="id">Jedna seria: jeden kolor, bez legendy</span><div class="hb"><span>Wesele</span><i style="width:93%"></i><b>214</b></div><div class="hb"><span>Cabaret</span><i style="width:73%"></i><b>168</b></div><div class="hb"><span>Zakonnica</span><i style="width:66%"></i><b>152</b></div><div class="hb"><span>School of Rock</span><i style="width:57%"></i><b>131</b></div><div class="hb"><span>Wilczy księżyc</span><i style="width:42%"></i><b>97</b></div></div>
</div>
</body>
</html>
